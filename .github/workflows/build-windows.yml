name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive   # remove this line if JUCE isn't a submodule

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find VST3 output
        shell: bash
        run: find build -iname "*.vst3" -type d

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LPfilter-VST3-Windows
          path: build/**/*.vst3